    <title>Ciggi Counter</title>
    <script>
(function () {
  var STORAGE_KEY = "cigicounter-data";
  var origFetch = window.fetch;

  function loadData() {
    try {
      return JSON.parse(
        localStorage.getItem(STORAGE_KEY) ||
          '{"cigarettes":[],"settings":{"dailyGoal":null}}'
      );
    } catch (e) {
      return { cigarettes: [], settings: { dailyGoal: null } };
    }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function jsonResponse(body, status) {
    return new Response(JSON.stringify(body), {
      status: status || 200,
      headers: { "Content-Type": "application/json" },
    });
  }

  function nextId() {
    return crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + "-" + Math.random().toString(16).slice(2);
  }

  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : input.url;
    var match = url.match(/(\/api\/.*)$/);
    if (!match) {
      return origFetch.apply(this, arguments);
    }

    var path = match[1].split("?")[0];
    var method = ((init && init.method) || "GET").toUpperCase();
    var data = loadData();

    if (path === "/api/cigarettes" && method === "GET") {
      return Promise.resolve(jsonResponse(data.cigarettes));
    }

    if (path === "/api/cigarettes" && method === "POST") {
      var body = JSON.parse((init && init.body) || "{}");
      var record = { id: nextId(), smokedAt: body.smokedAt };
      data.cigarettes.push(record);
      saveData(data);
      return Promise.resolve(jsonResponse(record, 201));
    }

    if (path.indexOf("/api/cigarettes/") === 0 && method === "DELETE") {
      var id = path.slice("/api/cigarettes/".length);
      data.cigarettes = data.cigarettes.filter(function (c) {
        return c.id !== id;
      });
      saveData(data);
      return Promise.resolve(new Response(null, { status: 204 }));
    }

    if (path === "/api/settings/daily-goal" && method === "GET") {
      return Promise.resolve(
        jsonResponse({ dailyGoal: data.settings.dailyGoal })
      );
    }

    if (path === "/api/settings/daily-goal" && method === "PUT") {
      var settingsBody = JSON.parse((init && init.body) || "{}");
      data.settings.dailyGoal = settingsBody.dailyGoal;
      saveData(data);
      return Promise.resolve(
        jsonResponse({ dailyGoal: settingsBody.dailyGoal })
      );
    }

    return origFetch.apply(this, arguments);
  };
})();
